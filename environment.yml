name: simmap
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - python=3.11
  - pip
  - pdal>=2.8,<2.10
  - python-pdal>=3.4,<4
  - gdal>=3.9,<3.12
  - proj>=9.4,<10
  - rasterio>=1.3,<2
  - geopandas>=1.0,<2
  - shapely>=2.0,<3
  - pyproj>=3.6,<4
  - numpy>=1.26,<3
  - scipy>=1.13,<2
  - scikit-image>=0.24,<1
  - nodejs>=22,<23
  - pip:
      - -e .[geo,dev]
